name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.4.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # One step, calling the same script the release workflow calls. Listing the
      # stages here instead let CI drift from `verify` — and it did: both ran
      # ts:check before anything was built, which cannot work on a clean checkout.
      - run: pnpm verify
